
<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>鮨 といろ｜お品書き</title>

<style>

/* =========================
   基本設定
========================= */

* {
  box-sizing: border-box;
}

:root {
  --gold: #d4af37;
  --gold-dark: #8f7440;
  --text: #f8f2e8;
  --subtext: #cfc2a5;
}

[hidden] {
  display: none !important;
}

body {
  margin: 0;
  min-height: 100vh;

  background: linear-gradient(
    to bottom,
    #050814,
    #090d19,
    #111827
  );

  color: var(--text);

  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;
}

button {
  font-family: inherit;
  cursor: pointer;
}


/* =========================
   ヘッダー
========================= */

.header {
  position: sticky;
  top: 0;
  width: 100%;
  z-index: 1000;

  text-align: center;
  padding: 7px 14px 10px;

  background: rgba(3, 6, 15, 0.97);

  border-bottom:
    1px solid rgba(212, 175, 55, 0.4);

  backdrop-filter: blur(8px);
}

.logo {
  width: 55px;
  height: 55px;

  object-fit: contain;
  display: block;

  margin: 0 auto 3px;
}

.shop-name {
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

.gold-line {
  width: 100px;
  height: 1px;

  margin: 5px auto 9px;

  background: linear-gradient(
    to right,
    transparent,
    var(--gold),
    transparent
  );
}


/* =========================
   言語切り替え
========================= */

.language {
  display: flex;
  justify-content: center;
  gap: 9px;
}

.language button {
  padding: 7px 18px;

  font-size: 13px;
  color: var(--text);

  background: transparent;

  border: 1px solid var(--gold-dark);
  border-radius: 999px;
}

.language button.active {
  background: var(--gold);
  color: #050814;
  border-color: var(--gold);
}


/* =========================
   メイン
========================= */

.container {
  max-width: 580px;
  margin: 0 auto;
  padding: 22px 16px 60px;
}

.panel {
  background: rgba(255,255,255,0.035);

  border: 1px solid rgba(212,175,55,0.25);
  border-radius: 16px;

  padding: 28px 19px 34px;

  box-shadow:
    0 10px 30px rgba(0,0,0,0.25);
}

h1 {
  text-align: center;
  font-size: 27px;
  font-weight: normal;
  letter-spacing: 5px;
  margin: 0 0 18px;
}

h2 {
  text-align: center;
  font-size: 24px;
  font-weight: normal;
  letter-spacing: 3px;
  margin: 0 0 12px;
}

.subtitle {
  text-align: center;
  color: var(--subtext);
  font-size: 14px;
  margin-bottom: 30px;
}


/* =========================
   選択ボタン
========================= */

.select-button {
  display: block;
  width: 100%;

  margin: 16px 0;
  padding: 22px 15px;

  font-size: 20px;
  color: var(--text);

  background: rgba(255,255,255,0.03);

  border: 1px solid rgba(212,175,55,0.5);
  border-radius: 10px;

  transition: 0.2s;
}

.select-button:hover {
  background: rgba(212,175,55,0.10);
}


/* =========================
   料理一覧
========================= */

.price {
  text-align: center;
  color: var(--gold);
  font-size: 21px;
  margin: 0 0 30px;
}

.category {
  text-align: center;

  font-size: 20px;
  font-weight: normal;

  color: var(--gold);
  letter-spacing: 3px;

  margin-top: 37px;
  margin-bottom: 17px;
  padding-bottom: 9px;

  border-bottom:
    1px solid rgba(212,175,55,0.35);
}

.item {
  text-align: center;

  font-size: 17px;
  line-height: 1.9;

  margin: 13px 0;

  color: #f5eee2;
}


/* =========================
   戻るボタン
========================= */

.back-button {
  display: block;

  margin: 45px auto 0;
  padding: 11px 28px;

  font-size: 15px;
  color: var(--text);

  background: transparent;

  border: 1px solid var(--gold-dark);
  border-radius: 999px;
}

.back-button:hover {
  background: rgba(212,175,55,0.12);
}


/* =========================
   フッター
========================= */

.footer {
  text-align: center;
  margin-top: 38px;

  font-size: 11px;
  color: var(--gold-dark);
  letter-spacing: 3px;
}


/* =========================
   スマホ対応
========================= */

@media (max-width: 480px) {

  .logo {
    width: 50px;
    height: 50px;
  }

  .container {
    padding: 18px 14px 45px;
  }

  .panel {
    padding: 24px 15px 28px;
  }

  h1 {
    font-size: 25px;
  }

  h2 {
    font-size: 22px;
  }

  .category {
    font-size: 19px;
  }

  .item {
    font-size: 16px;
  }

  .select-button {
    font-size: 19px;
  }

}

</style>
</head>


<body>


<!-- =========================
     ヘッダー
========================= -->

<header class="header">

  <img
    src="logo.png"
    alt="鮨 といろ"
    class="logo"
  >

  <div class="shop-name">
    SUSHI TOIRO
  </div>

  <div class="gold-line"></div>

  <div class="language">

    <button
      id="jaButton"
      class="active"
      onclick="setLanguage('ja')"
      aria-pressed="true"
    >
      日本語
    </button>

    <button
      id="enButton"
      onclick="setLanguage('en')"
      aria-pressed="false"
    >
      English
    </button>

  </div>

</header>



<main class="container">

<div class="panel">


<!-- =========================
     最初の画面：席を選択
========================= -->

<div id="seatPage">

  <h1 id="homeTitle">
    10月のお品書き
  </h1>

  <div
    class="subtitle"
    id="seatSubtitle"
  >
    お席をお選びください
  </div>

  <button
    class="select-button"
    id="counterButton"
    onclick="showSeat('counter')"
  >
    カウンター
  </button>

  <button
    class="select-button"
    id="tableButton"
    onclick="showSeat('table')"
  >
    テーブル
  </button>

</div>



<!-- =========================
     価格選択
========================= -->

<div id="pricePage" hidden>

  <h2 id="seatTitle"></h2>

  <div
    class="subtitle"
    id="courseSubtitle"
  ></div>

  <div id="courseButtons"></div>

  <button
    class="back-button"
    id="backToSeat"
    onclick="goSeatPage()"
  >
    ← 席種選択に戻る
  </button>

</div>



<!-- =========================
     コース表示
========================= -->

<div id="menuPage" hidden>

  <h2 id="menuTitle"></h2>

  <div
    class="price"
    id="menuPrice"
  ></div>

  <div id="menuContent"></div>

  <button
    class="back-button"
    id="backToPrice"
    onclick="goPricePage()"
  >
    ← コース選択に戻る
  </button>

  <button
    class="back-button"
    id="backToSeatFromMenu"
    onclick="goSeatPage()"
  >
    ← 席種選択に戻る
  </button>

</div>


</div>


<div class="footer">
  SUSHI TOIRO
</div>

</main>



<script>

/* =========================
   現在の状態
========================= */

let currentLanguage = "ja";

let currentSeat = null;

let currentCourse = null;


/* =========================
   各種表示文字
========================= */

const texts = {

  ja: {

    month: "10月のお品書き",

    seatSelect: "お席をお選びください",

    counter: "カウンター",

    table: "テーブル",

    courseSelect: "コースをお選びください",

    backSeat: "← 席種選択に戻る",

    backCourse: "← コース選択に戻る",

    sushi: "鮨",

    ippin: "一品料理",

    soup: "お椀",

    dessert: "甘味"

  },

  en: {

    month: "October Menu",

    seatSelect: "Please select your seating",

    counter: "Counter Seating",

    table: "Table Seating",

    courseSelect: "Please select a course",

    backSeat: "← Back to Seating",

    backCourse: "← Back to Courses",

    sushi: "Sushi",

    ippin: "Seasonal Dishes",

    soup: "Soup",

    dessert: "Dessert"

  }

};



/* =========================
   料理データ
========================= */

const dishes = {


  uniTasting: {
    ja: "ウニ食べ比べ",
    en: "Sea Urchin Tasting",
    type: "ippin"
  },


  eelCustard: {
    ja: "鰻とカボチャ餡の茶碗蒸し",
    en: "Steamed Egg Custard with Eel and Pumpkin Sauce",
    type: "ippin"
  },


  squid: {
    ja: "イカ　墨塩",
    en: "Squid (Squid Ink Salt)",
    type: "sushi"
  },


  kohada: {
    ja: "コハダ　おぼろ",
    en: "Gizzard Shad with Oboro",
    type: "sushi"
  },


  shrimp: {
    ja: "生エビ　エビパウダー",
    en: "Fresh Shrimp (Shrimp Powder)",
    type: "sushi"
  },


  island: {
    ja: "島寿司　辛子",
    en: "Island-style Sushi with Mustard",
    type: "sushi"
  },


  arkClam: {
    ja: "赤貝",
    en: "Ark Shell",
    type: "sushi"
  },


  fried: {
    ja: "カマスの竜田揚げ",
    en: "Japanese Barracuda Tatsuta-age",
    type: "ippin"
  },


  abalone: {
    ja: "鮑酒蒸し　肝ソース",
    en: "Sake-steamed Abalone with Liver Sauce",
    type: "ippin"
  },


  kinmedai: {
    ja: "鱧と松茸の一口蒸し",
    en: "Bite-sized Steamed Pike Conger and Matsutake Mushrooms",
    type: "ippin"
  },


  akami: {
    ja: "赤身",
    en: "Lean Tuna",
    type: "sushi"
  },


  chutoro: {
    ja: "中トロ",
    en: "Medium Fatty Tuna",
    type: "sushi"
  },


  torotaku: {
    ja: "トロタクおはぎ",
    en: "Toro-Taku Ohagi",
    type: "sushi"
  },


  nodoguro: {
    ja: "ノドグロ炙り　塩スダチ",
    en: "Seared Blackthroat Seaperch (Salt and Sudachi)",
    type: "sushi"
  },


  anago: {
    ja: "穴子",
    en: "Conger Eel",
    type: "sushi"
  },


  tamago: {
    ja: "玉子",
    en: "Japanese Omelet",
    type: "sushi"
  },


  soup: {
    ja: "お椀",
    en: "Soup",
    type: "soup"
  },


  dessert: {
    ja: "甘味",
    en: "Dessert",
    type: "dessert"
  },


  seasonal: {
    ja: "強肴",
    en: "Seasonal Special Dish",
    type: "ippin"
  },


  surfClam: {
    ja: "北寄貝炙り　塩スダチ",
    en: "Seared Surf Clam (Salt and Sudachi)",
    type: "sushi"
  },


  whitefish: {
    ja: "白身昆布〆",
    en: "Kelp-cured White Fish",
    type: "sushi"
  },


  uni: {
    ja: "ウニ",
    en: "Sea Urchin",
    type: "sushi"
  },


  scallop: {
    ja: "ホタテ",
    en: "Scallop",
    type: "sushi"
  },


  toiroRoll: {
    ja: "といろ巻き（中巻き1貫）",
    en: "Toiro Roll (1 Piece)",
    type: "sushi"
  }

};



/* =========================
   10月のコースデータ
========================= */

const courses = {


  /* =====================
     カウンター
  ===================== */

  counter: {


    /* 16,900円コース */

    "16900": [

      "uniTasting",

      "eelCustard",

      "squid",

      "kohada",

      "shrimp",

      "island",

      "arkClam",

      "fried",

      "abalone",

      "kinmedai",

      "akami",

      "chutoro",

      "torotaku",

      "nodoguro",

      "anago",

      "tamago",

      "soup",

      "dessert"

    ],



    /* 13,900円コース */

    "13900": [

      "seasonal",

      "eelCustard",

      "squid",

      "kohada",

      "shrimp",

      "surfClam",

      "fried",

      "kinmedai",

      "akami",

      "chutoro",

      "torotaku",

      "whitefish",

      "anago",

      "uni",

      "tamago",

      "soup",

      "dessert"

    ]

  },



  /* =====================
     テーブル
  ===================== */

  table: {


    /* 10,800円コース */

    "10800": [

      "seasonal",

      "squid",

      "kohada",

      "shrimp",

      "island",

      "surfClam",

      "whitefish",

      "eelCustard",

      "akami",

      "chutoro",

      "torotaku",

      "scallop",

      "anago",

      "toiroRoll",

      "tamago",

      "soup"

    ],



    /* 8,800円コース */

    "8800": [

      "squid",

      "kohada",

      "shrimp",

      "island",

      "surfClam",

      "whitefish",

      "akami",

      "chutoro",

      "torotaku",

      "scallop",

      "anago",

      "toiroRoll",

      "tamago",

      "soup"

    ]

  }

};



/* =========================
   便利な処理
========================= */

function t(key) {

  return texts[currentLanguage][key];

}


function formatPrice(price) {

  return Number(price).toLocaleString("ja-JP");

}


function createElement(tag, className, value) {

  const el = document.createElement(tag);

  if (className) {
    el.className = className;
  }

  if (value !== undefined) {
    el.textContent = value;
  }

  return el;

}



/* =========================
   言語変更
========================= */

function setLanguage(lang) {

  currentLanguage = lang;

  document.documentElement.lang = lang;

  render();

}



/* =========================
   席を選択
========================= */

function showSeat(seat) {

  currentSeat = seat;

  currentCourse = null;

  render();

  window.scrollTo(0, 0);

}



/* =========================
   価格を選択
========================= */

function showCourse(course) {

  currentCourse = course;

  render();

  window.scrollTo(0, 0);

}



/* =========================
   席選択に戻る
========================= */

function goSeatPage() {

  currentSeat = null;

  currentCourse = null;

  render();

  window.scrollTo(0, 0);

}



/* =========================
   価格選択に戻る
========================= */

function goPricePage() {

  currentCourse = null;

  render();

  window.scrollTo(0, 0);

}



/* =========================
   料理一覧を表示
========================= */

function renderMenu() {

  const container =
    document.getElementById("menuContent");

  container.replaceChildren();

  const list =
    courses[currentSeat][currentCourse];

  let previousType = null;


  list.forEach(function(key) {

    const dish = dishes[key];

    const type = dish.type;


    /*
      鮨・一品料理が切り替わるときだけ
      金色の見出しを表示する
    */

    if (type !== previousType) {

      const heading = createElement(
        "h3",
        "category",
        t(type)
      );

      container.appendChild(heading);

      previousType = type;

    }


    /*
      お椀・甘味は
      見出しだけ表示
    */

    if (
      type === "soup" ||
      type === "dessert"
    ) {

      return;

    }


    /*
      料理名を表示
    */

    const item = createElement(
      "div",
      "item",
      dish[currentLanguage]
    );

    container.appendChild(item);

  });

}



/* =========================
   全画面の更新
========================= */

function render() {


  /* 言語切り替えボタン */

  document
    .getElementById("jaButton")
    .classList.toggle(
      "active",
      currentLanguage === "ja"
    );


  document
    .getElementById("enButton")
    .classList.toggle(
      "active",
      currentLanguage === "en"
    );


  document
    .getElementById("jaButton")
    .setAttribute(
      "aria-pressed",
      String(currentLanguage === "ja")
    );


  document
    .getElementById("enButton")
    .setAttribute(
      "aria-pressed",
      String(currentLanguage === "en")
    );



  /* 各ページ */

  const seatPage =
    document.getElementById("seatPage");

  const pricePage =
    document.getElementById("pricePage");

  const menuPage =
    document.getElementById("menuPage");


  seatPage.hidden =
    currentSeat !== null;


  pricePage.hidden =
    currentSeat === null ||
    currentCourse !== null;


  menuPage.hidden =
    currentCourse === null;



  /* 最初の画面 */

  document
    .getElementById("homeTitle")
    .textContent = t("month");


  document
    .getElementById("seatSubtitle")
    .textContent = t("seatSelect");


  document
    .getElementById("counterButton")
    .textContent = t("counter");


  document
    .getElementById("tableButton")
    .textContent = t("table");



  if (currentSeat === null) {

    return;

  }



  /* 価格選択画面 */

  document
    .getElementById("seatTitle")
    .textContent = t(currentSeat);


  document
    .getElementById("courseSubtitle")
    .textContent = t("courseSelect");


  document
    .getElementById("backToSeat")
    .textContent = t("backSeat");



  const buttons =
    document.getElementById("courseButtons");

  buttons.replaceChildren();



  Object.keys(courses[currentSeat])

    .sort(function(a, b) {

      return Number(b) - Number(a);

    })

    .forEach(function(price) {


      const btn = createElement(
        "button",
        "select-button"
      );


      btn.textContent =
        currentLanguage === "ja"

        ? formatPrice(price) + "円コース"

        : "¥" + formatPrice(price) + " Course";


      btn.onclick = function() {

        showCourse(price);

      };


      buttons.appendChild(btn);

    });



  if (currentCourse === null) {

    return;

  }



  /* 料理一覧画面 */

  document
    .getElementById("menuTitle")
    .textContent =
      t("month") + "・" + t(currentSeat);


  document
    .getElementById("menuPrice")
    .textContent =
      currentLanguage === "ja"

      ? formatPrice(currentCourse) + "円"

      : "¥" + formatPrice(currentCourse);



  document
    .getElementById("backToPrice")
    .textContent = t("backCourse");


  document
    .getElementById("backToSeatFromMenu")
    .textContent = t("backSeat");



  renderMenu();

}



/* =========================
   最初の表示
========================= */

render();

</script>

</body>
</html>
