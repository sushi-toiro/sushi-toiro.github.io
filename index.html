
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鮨 といろ｜お品書き</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --gold: #d4af37;
      --gold-dark: #8f7440;
      --text: #f8f2e8;
      --subtext: #cfc2a5;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(
        to bottom,
        #050814,
        #090d19,
        #111827
      );
      color: var(--text);
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    }

    button, a {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    /* ヘッダー */

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      text-align: center;
      padding: 7px 14px 10px;
      background: rgba(3, 6, 15, 0.97);
      border-bottom: 1px solid rgba(212, 175, 55, 0.4);
      backdrop-filter: blur(8px);
    }

    .logo {
      display: block;
      width: 55px;
      height: 55px;
      object-fit: contain;
      margin: 0 auto 3px;
    }

    .shop-name {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 3px;
      margin-bottom: 7px;
    }

    .gold-line {
      width: 100px;
      height: 1px;
      margin: 5px auto 9px;
      background: linear-gradient(
        to right,
        transparent,
        var(--gold),
        transparent
      );
    }

    /* 言語切り替え */

    .language {
      display: flex;
      justify-content: center;
      gap: 9px;
    }

    .language button {
      padding: 7px 18px;
      font-size: 13px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--gold-dark);
      border-radius: 999px;
    }

    .language button.active {
      background: var(--gold);
      color: #050814;
      border-color: var(--gold);
    }

    /* メニュー画面 */

    .container {
      max-width: 580px;
      margin: 0 auto;
      padding: 22px 16px 42px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 16px;
      padding: 28px 19px 34px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    h1, h2 {
      text-align: center;
      font-weight: normal;
    }

    h1 {
      font-size: 27px;
      letter-spacing: 5px;
      margin: 0 0 18px;
    }

    h2 {
      font-size: 24px;
      letter-spacing: 3px;
      margin: 0 0 12px;
    }

    .subtitle {
      text-align: center;
      color: var(--subtext);
      font-size: 14px;
      margin-bottom: 30px;
    }

    /* 選択ボタン */

    .select-button {
      display: block;
      width: 100%;
      margin: 16px 0;
      padding: 22px 15px;
      font-size: 20px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 10px;
      transition: 0.2s;
    }

    .select-button:hover {
      background: rgba(212, 175, 55, 0.1);
    }

    /* 料理一覧 */

    .price {
      text-align: center;
      color: var(--gold);
      font-size: 21px;
      margin: 0 0 30px;
    }

    .category {
      text-align: center;
      font-size: 20px;
      font-weight: normal;
      color: var(--gold);
      letter-spacing: 3px;
      margin-top: 37px;
      margin-bottom: 17px;
      padding-bottom: 9px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
    }

    .item {
      text-align: center;
      font-size: 17px;
      line-height: 1.9;
      margin: 13px 0;
      color: #f5eee2;
    }

    /* 戻るボタン */

    .back-button {
      display: block;
      margin: 38px auto 0;
      padding: 11px 28px;
      font-size: 15px;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--gold-dark);
      border-radius: 999px;
    }

    .back-button:hover {
      background: rgba(212, 175, 55, 0.12);
    }

    /* Instagramロゴ */

    .instagram-footer {
      text-align: center;
      padding: 8px 16px 38px;
    }

    .instagram-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      color: var(--gold);
      border: 1px solid var(--gold-dark);
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.05);
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .instagram-link:hover,
    .instagram-link:focus-visible {
      background: rgba(212, 175, 55, 0.16);
    }

    .instagram-link svg {
      width: 30px;
      height: 30px;
    }

    .copyright {
      text-align: center;
      margin: 20px 0 0;
      color: var(--gold-dark);
      font-size: 10px;
      letter-spacing: 3px;
    }

    /* スマホ用 */

    @media (max-width: 480px) {
      .logo {
        width: 50px;
        height: 50px;
      }

      .container {
        padding: 18px 14px 36px;
      }

      .panel {
        padding: 24px 15px 28px;
      }

      h1 {
        font-size: 25px;
      }

      h2 {
        font-size: 22px;
      }

      .category {
        font-size: 19px;
      }

      .item {
        font-size: 16px;
      }

      .select-button {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <!-- ヘッダー -->

  <header class="header">

    <img
      src="logo.png"
      alt="鮨 といろ"
      class="logo"
    >

    <div class="shop-name">
      SUSHI TOIRO
    </div>

    <div class="gold-line"></div>

    <div class="language">

      <button
        id="jaButton"
        class="active"
        onclick="setLanguage('ja')"
        aria-pressed="true"
      >
        日本語
      </button>

      <button
        id="enButton"
        onclick="setLanguage('en')"
        aria-pressed="false"
      >
        English
      </button>

    </div>

  </header>

  <!-- メニュー -->

  <main class="container">

    <div class="panel">

      <!-- 席種選択 -->

      <div id="seatPage">

        <h1 id="homeTitle">
          10月のお品書き
        </h1>

        <div
          class="subtitle"
          id="seatSubtitle"
        >
          お席をお選びください
        </div>

        <button
          class="select-button"
          id="counterButton"
          onclick="showSeat('counter')"
        >
          カウンター
        </button>

        <button
          class="select-button"
          id="tableButton"
          onclick="showSeat('table')"
        >
          テーブル
        </button>

      </div>

      <!-- コース選択 -->

      <div id="pricePage" hidden>

        <h2 id="seatTitle"></h2>

        <div
          class="subtitle"
          id="courseSubtitle"
        ></div>

        <div id="courseButtons"></div>

        <button
          class="back-button"
          id="backToSeat"
          onclick="goSeatPage()"
        >
          ← 席種選択に戻る
        </button>

      </div>

      <!-- 料理一覧 -->

      <div id="menuPage" hidden>

        <h2 id="menuTitle"></h2>

        <div
          class="price"
          id="menuPrice"
        ></div>

        <div id="menuContent"></div>

        <button
          class="back-button"
          id="backToPrice"
          onclick="goPricePage()"
        >
          ← コース選択に戻る
        </button>

        <button
          class="back-button"
          id="backToSeatFromMenu"
          onclick="goSeatPage()"
        >
          ← 席種選択に戻る
        </button>

      </div>

    </div>

  </main>

  <!-- 一番下のInstagramロゴ -->

  <footer class="instagram-footer">

    <a
      class="instagram-link"
      href="https://www.instagram.com/p/DZavhNGkjME/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagramを見る（新しいタブで開く）"
      title="Instagram"
    >

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect
          x="2"
          y="2"
          width="20"
          height="20"
          rx="5"
        ></rect>

        <circle
          cx="12"
          cy="12"
          r="4"
        ></circle>

        <circle
          cx="17.6"
          cy="6.4"
          r="1"
          fill="currentColor"
          stroke="none"
        ></circle>
      </svg>

    </a>

    <p class="copyright">
      SUSHI TOIRO
    </p>

  </footer>

  <script>

    /* 基本設定 */

    let currentLanguage = "ja";
    let currentSeat = null;
    let currentCourse = null;

    /* 日本語・英語 */

    const texts = {

      ja: {
        month: "10月のお品書き",
        seatSelect: "お席をお選びください",

        counter: "カウンター",
        table: "テーブル",

        courseSelect: "コースをお選びください",

        backSeat: "← 席種選択に戻る",
        backCourse: "← コース選択に戻る",

        sushi: "鮨",
        ippin: "一品料理",
        soup: "お椀",
        dessert: "甘味"
      },

      en: {
        month: "October Menu",
        seatSelect: "Please select your seating",

        counter: "Counter Seating",
        table: "Table Seating",

        courseSelect: "Please select a course",

        backSeat: "← Back to Seating",
        backCourse: "← Back to Courses",

        sushi: "Sushi",
        ippin: "Seasonal Dishes",
        soup: "Soup",
        dessert: "Dessert"
      }

    };

    /* 料理データ */

    const dishes = {

      uniTasting: {
        ja: "ウニ食べ比べ",
        en: "Sea Urchin Tasting",
        type: "ippin"
      },

      eelCustard: {
        ja: "鰻とカボチャ餡の茶碗蒸し",
        en: "Steamed Egg Custard with Eel and Pumpkin Sauce",
        type: "ippin"
      },

      squid: {
        ja: "イカ　墨塩",
        en: "Squid (Squid Ink Salt)",
        type: "sushi"
      },

      kohada: {
        ja: "コハダ　おぼろ",
        en: "Gizzard Shad with Oboro",
        type: "sushi"
      },

      shrimp: {
        ja: "生エビ　エビパウダー",
        en: "Fresh Shrimp (Shrimp Powder)",
        type: "sushi"
      },

      island: {
        ja: "島寿司　辛子",
        en: "Island-style Sushi with Mustard",
        type: "sushi"
      },

      arkClam: {
        ja: "赤貝",
        en: "Ark Shell",
        type: "sushi"
      },

      fried: {
        ja: "カマスの竜田揚げ",
        en: "Japanese Barracuda Tatsuta-age",
        type: "ippin"
      },

      abalone: {
        ja: "鮑酒蒸し　肝ソース",
        en: "Sake-steamed Abalone with Liver Sauce",
        type: "ippin"
      },

      kinmedai: {
        ja: "鱧と松茸の一口蒸し",
        en: "Bite-sized Steamed Pike Conger and Matsutake Mushrooms",
        type: "ippin"
      },

      akami: {
        ja: "赤身",
        en: "Lean Tuna",
        type: "sushi"
      },

      chutoro: {
        ja: "中トロ",
        en: "Medium Fatty Tuna",
        type: "sushi"
      },

      torotaku: {
        ja: "トロタクおはぎ",
        en: "Toro-Taku Ohagi",
        type: "sushi"
      },

      nodoguro: {
        ja: "ノドグロ炙り　塩スダチ",
        en: "Seared Blackthroat Seaperch (Salt and Sudachi)",
        type: "sushi"
      },

      anago: {
        ja: "穴子",
        en: "Conger Eel",
        type: "sushi"
      },

      tamago: {
        ja: "玉子",
        en: "Japanese Omelet",
        type: "sushi"
      },

      soup: {
        ja: "お椀",
        en: "Soup",
        type: "soup"
      },

      dessert: {
        ja: "甘味",
        en: "Dessert",
        type: "dessert"
      },

      seasonal: {
        ja: "強肴",
        en: "Seasonal Special Dish",
        type: "ippin"
      },

      surfClam: {
        ja: "北寄貝炙り　塩スダチ",
        en: "Seared Surf Clam (Salt and Sudachi)",
        type: "sushi"
      },

      whitefish: {
        ja: "白身昆布〆",
        en: "Kelp-cured White Fish",
        type: "sushi"
      },

      uni: {
        ja: "ウニ",
        en: "Sea Urchin",
        type: "sushi"
      },

      scallop: {
        ja: "ホタテ",
        en: "Scallop",
        type: "sushi"
      },

      toiroRoll: {
        ja: "といろ巻き（中巻き1貫）",
        en: "Toiro Roll (1 Piece)",
        type: "sushi"
      }

    };

    /* コース構成 */

    const courses = {

      counter: {

        /* カウンター 16,900円 */

        "16900": [
          "uniTasting",
          "eelCustard",
          "squid",
          "kohada",
          "shrimp",
          "island",
          "arkClam",
          "fried",
          "abalone",
          "kinmedai",
          "akami",
          "chutoro",
          "torotaku",
          "nodoguro",
          "anago",
          "tamago",
          "soup",
          "dessert"
        ],

        /* カウンター 13,900円 */

        "13900": [
          "seasonal",
          "eelCustard",
          "squid",
          "kohada",
          "shrimp",
          "surfClam",
          "fried",
          "kinmedai",
          "akami",
          "chutoro",
          "torotaku",
          "whitefish",
          "anago",
          "uni",
          "tamago",
          "soup",
          "dessert"
        ]

      },

      table: {

        /* テーブル 10,800円 */

        "10800": [
          "seasonal",
          "squid",
          "kohada",
          "shrimp",
          "island",
          "surfClam",
          "whitefish",
          "eelCustard",
          "akami",
          "chutoro",
          "torotaku",
          "scallop",
          "anago",
          "toiroRoll",
          "tamago",
          "soup"
        ],

        /* テーブル 8,800円 */

        "8800": [
          "squid",
          "kohada",
          "shrimp",
          "island",
          "surfClam",
          "whitefish",
          "akami",
          "chutoro",
          "torotaku",
          "scallop",
          "anago",
          "toiroRoll",
          "tamago",
          "soup"
        ]

      }

    };

    /* 共通関数 */

    function t(key) {
      return texts[currentLanguage][key];
    }

    function formatPrice(price) {
      return Number(price).toLocaleString("ja-JP");
    }

    function createElement(tag, className, value) {

      const el = document.createElement(tag);

      if (className) {
        el.className = className;
      }

      if (value !== undefined) {
        el.textContent = value;
      }

      return el;

    }

    /* 言語変更 */

    function setLanguage(lang) {

      currentLanguage = lang;
      document.documentElement.lang = lang;

      render();

    }

    /* 席を選択 */

    function showSeat(seat) {

      currentSeat = seat;
      currentCourse = null;

      render();
      window.scrollTo(0, 0);

    }

    /* コースを選択 */

    function showCourse(course) {

      currentCourse = course;

      render();
      window.scrollTo(0, 0);

    }

    /* 席種選択に戻る */

    function goSeatPage() {

      currentSeat = null;
      currentCourse = null;

      render();
      window.scrollTo(0, 0);

    }

    /* コース選択に戻る */

    function goPricePage() {

      currentCourse = null;

      render();
      window.scrollTo(0, 0);

    }

    /* 料理一覧を表示 */

    function renderMenu() {

      const container =
        document.getElementById("menuContent");

      container.replaceChildren();

      const list =
        courses[currentSeat][currentCourse];

      let previousType = null;

      list.forEach(function(key) {

        const dish = dishes[key];
        const type = dish.type;

        // 種類が変わるときだけ見出しを表示

        if (type !== previousType) {

          container.appendChild(
            createElement("h3", "category", t(type))
          );

          previousType = type;

        }

        // お椀と甘味は見出しだけ表示

        if (
          type === "soup" ||
          type === "dessert"
        ) {
          return;
        }

        // 料理名を表示

        container.appendChild(
          createElement(
            "div",
            "item",
            dish[currentLanguage]
          )
        );

      });

    }

    /* 画面全体を更新 */

    function render() {

      // 言語切り替えボタン

      document
        .getElementById("jaButton")
        .classList.toggle(
          "active",
          currentLanguage === "ja"
        );

      document
        .getElementById("enButton")
        .classList.toggle(
          "active",
          currentLanguage === "en"
        );

      document
        .getElementById("jaButton")
        .setAttribute(
          "aria-pressed",
          String(currentLanguage === "ja")
        );

      document
        .getElementById("enButton")
        .setAttribute(
          "aria-pressed",
          String(currentLanguage === "en")
        );

      // 各ページの表示設定

      document
        .getElementById("seatPage")
        .hidden = currentSeat !== null;

      document
        .getElementById("pricePage")
        .hidden =
          currentSeat === null ||
          currentCourse !== null;

      document
        .getElementById("menuPage")
        .hidden = currentCourse === null;

      // 席種選択画面

      document
        .getElementById("homeTitle")
        .textContent = t("month");

      document
        .getElementById("seatSubtitle")
        .textContent = t("seatSelect");

      document
        .getElementById("counterButton")
        .textContent = t("counter");

      document
        .getElementById("tableButton")
        .textContent = t("table");

      if (currentSeat === null) {
        return;
      }

      // コース選択画面

      document
        .getElementById("seatTitle")
        .textContent = t(currentSeat);

      document
        .getElementById("courseSubtitle")
        .textContent = t("courseSelect");

      document
        .getElementById("backToSeat")
        .textContent = t("backSeat");

      const buttons =
        document.getElementById("courseButtons");

      buttons.replaceChildren();

      Object.keys(courses[currentSeat])
        .sort((a, b) => Number(b) - Number(a))
        .forEach(function(price) {

          const btn = createElement(
            "button",
            "select-button"
          );

          btn.textContent =
            currentLanguage === "ja"
              ? formatPrice(price) + "円コース"
              : "¥" + formatPrice(price) + " Course";

          btn.onclick = function() {
            showCourse(price);
          };

          buttons.appendChild(btn);

        });

      if (currentCourse === null) {
        return;
      }

      // 料理一覧画面

      document
        .getElementById("menuTitle")
        .textContent =
          t("month") + "・" + t(currentSeat);

      document
        .getElementById("menuPrice")
        .textContent =
          currentLanguage === "ja"
            ? formatPrice(currentCourse) + "円"
            : "¥" + formatPrice(currentCourse);

      document
        .getElementById("backToPrice")
        .textContent = t("backCourse");

      document
        .getElementById("backToSeatFromMenu")
        .textContent = t("backSeat");

      renderMenu();

    }

    // 初期表示
    render();

  </script>

</body>
</html>
