
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>鮨 といろ｜お品書き</title>

  <style>

    /* =========================
       全体設定
       ========================= */

    * {
      box-sizing: border-box;
    }

    :root {
      --background: #050814;
      --gold: #d4af37;
      --gold-dark: #8f7440;
      --text: #f8f2e8;
      --subtext: #cfc2a5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(
        to bottom,
        #050814,
        #090d19,
        #111827
      );
      color: var(--text);
      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    [hidden] {
      display: none !important;
    }


    /* =========================
       ロゴ・ヘッダー
       ========================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 1000;

      width: 100%;

      background: rgba(3, 6, 15, 0.97);

      border-bottom:
        1px solid rgba(212, 175, 55, 0.4);

      backdrop-filter: blur(8px);

      text-align: center;
      padding: 7px 12px 9px;
    }

    .logo {
      display: block;
      width: 55px;
      height: auto;
      margin: 0 auto 4px;
    }

    .shop-name {
      font-size: 10px;
      color: var(--gold);
      letter-spacing: 3px;
      margin-bottom: 7px;
    }

    .gold-line {
      width: 100px;
      height: 1px;

      margin: 5px auto 9px;

      background: linear-gradient(
        to right,
        transparent,
        var(--gold),
        transparent
      );
    }


    /* =========================
       言語切り替え
       ========================= */

    .language {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .language button {
      padding: 7px 19px;

      font-size: 13px;

      color: var(--text);
      background: transparent;

      border: 1px solid var(--gold-dark);
      border-radius: 30px;

      transition: 0.2s;
    }

    .language button.active {
      background: var(--gold);
      color: #050814;
      border-color: var(--gold);
    }


    /* =========================
       メイン部分
       ========================= */

    .container {
      width: 100%;
      max-width: 580px;

      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.035);

      border:
        1px solid rgba(212, 175, 55, 0.3);

      border-radius: 16px;

      padding: 30px 20px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;

      font-size: 28px;
      font-weight: normal;
      letter-spacing: 5px;

      margin: 0 0 32px;
    }

    h2 {
      text-align: center;

      font-size: 24px;
      font-weight: normal;
      letter-spacing: 3px;

      margin: 0 0 12px;
    }


    /* =========================
       コース選択ボタン
       ========================= */

    .course-button {
      display: block;

      width: 100%;

      padding: 24px 15px;
      margin: 17px 0;

      font-size: 20px;

      color: var(--text);

      background: rgba(255, 255, 255, 0.03);

      border:
        1px solid rgba(212, 175, 55, 0.55);

      border-radius: 10px;

      transition: 0.2s;
    }

    .course-button:hover {
      background: rgba(212, 175, 55, 0.1);
    }


    /* =========================
       コース料理一覧
       ========================= */

    .course-price {
      text-align: center;

      color: var(--gold);

      font-size: 22px;
      letter-spacing: 1px;

      margin-bottom: 35px;
    }

    .section {
      margin-top: 35px;
    }

    .category {
      text-align: center;

      color: var(--gold);

      font-size: 20px;
      font-weight: normal;
      letter-spacing: 3px;

      padding-bottom: 10px;
      margin-bottom: 18px;

      border-bottom:
        1px solid rgba(212, 175, 55, 0.35);
    }

    .dish-list {
      list-style: none;

      padding: 0;
      margin: 0;
    }

    .dish-list li {
      text-align: center;

      font-size: 17px;
      line-height: 1.9;

      padding: 8px 4px;
      margin-bottom: 6px;

      color: var(--text);
    }


    /* =========================
       戻るボタン
       ========================= */

    .back-button {
      display: block;

      margin: 48px auto 0;

      padding: 12px 30px;

      font-size: 15px;

      color: var(--text);
      background: transparent;

      border: 1px solid var(--gold-dark);
      border-radius: 30px;
    }

    .back-button:hover {
      background: rgba(212, 175, 55, 0.1);
    }


    /* =========================
       フッター
       ========================= */

    .footer {
      text-align: center;

      margin-top: 45px;

      color: var(--gold-dark);

      font-size: 11px;
      letter-spacing: 3px;
    }


    /* =========================
       スマホ対応
       ========================= */

    @media (max-width: 480px) {

      .logo {
        width: 50px;
      }

      .container {
        padding: 20px 14px 45px;
      }

      .panel {
        padding: 26px 15px;
      }

      h1 {
        font-size: 25px;
      }

      h2 {
        font-size: 22px;
      }

      .category {
        font-size: 19px;
      }

      .dish-list li {
        font-size: 16px;
      }

      .course-button {
        font-size: 19px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       上部ロゴ・言語切り替え
       ========================= -->

  <header class="header">

    <img
      src="logo.png"
      alt="鮨 といろ"
      class="logo"
    >

    <div class="shop-name">
      SUSHI TOIRO
    </div>

    <div class="gold-line"></div>

    <div class="language">

      <button
        id="jaButton"
        class="active"
        onclick="setLanguage('ja')"
        aria-pressed="true"
      >
        日本語
      </button>

      <button
        id="enButton"
        onclick="setLanguage('en')"
        aria-pressed="false"
      >
        English
      </button>

    </div>

  </header>


  <!-- =========================
       メニュー本体
       ========================= -->

  <main class="container">

    <div class="panel">


      <!-- 最初のコース選択画面 -->

      <div id="home">

        <h1 id="homeTitle">
          お品書き
        </h1>

        <button
          class="course-button"
          data-course="9900"
          onclick="showCourse('9900')"
        >
          9,900円コース
        </button>

        <button
          class="course-button"
          data-course="13900"
          onclick="showCourse('13900')"
        >
          13,900円コース
        </button>

        <button
          class="course-button"
          data-course="16900"
          onclick="showCourse('16900')"
        >
          16,900円コース
        </button>

      </div>


      <!-- 選択したコースの表示画面 -->

      <div id="coursePage" hidden>

        <div id="courseContent"></div>

        <button
          id="backButton"
          class="back-button"
          onclick="goHome()"
        >
          ← 戻る
        </button>

      </div>


    </div>


    <footer class="footer">
      SUSHI TOIRO
    </footer>

  </main>



  <script>

    /* =========================
       基本設定
       ========================= */

    let currentLanguage = "ja";
    let currentCourse = null;

    // 月が変わったらここを変更
    const menuMonth = {
      ja: "9月のコース",
      en: "September Course"
    };


    /* =========================
       料理名（日英）
       ========================= */

      },

        en: "Squid (Charcoal Salt)"
      },

      bonito: {
        ja: "カツオ（高等葱ソース）",
        en: "Bonito (Green Onion Sauce)"
      },

      shellfish: {

        en: "Shellfish (Salt and Sudachi)"
      },

      },

      akami: {
        ja: "赤身",
        en: "Lean Tuna"
      },

      chutoro: {
        ja: "中トロ",
        en: "Medium Fatty Tuna"
      },

      whitefish: {
        ja: "白身の昆布〆",
        en: "Kelp-cured White Fish"
      },

      kohada: {
        ja: "コハダ",
        en: "Gizzard Shad"
      },

      torotaku: {
        ja: "トロタクおはぎ",
        en: "Toro-Taku Ohagi"
      },

      ikura: {
        ja: "イクラの小丼（ウニ添え）",
        en: "Mini Salmon Roe Rice Bowl with Sea Urchin"
      },

      tamago: {
        ja: "玉子",
        en: "Japanese Omelet"
      },

      uni: {
        ja: "ウニ食べ比べ",
        en: "Sea Urchin Tasting"
      },

      hamo: {

      },

      anago: {

        en: "Conger Eel"

      abalone: {

      }

    /* =========================

       ========================= */

    const courses = {


      /* =====================

      "9900": [

        {

            "crab",

          ]
        },

        {

          items: [
            "squid",
            "bonito",
            "shellfish",
            "shrimp",

          ]
        },

        {
          ja: "焼き物",
          en: "Grilled Dish",
          items: [
            "salmon"
          ]
        },

        {
          ja: "鮨",
          en: "Sushi",
          items: [
            "akami",
            "chutoro",
            "whitefish",
            "kohada",
            "torotaku",
            "ikura",
            "tamago"
          ]
        },

        {
          ja: "お椀",
          en: "Soup",
          items: []
        },

        {
          ja: "甘味",
          en: "Dessert",
          items: []
        }

      ],



      /* =====================
         13,900円
         ===================== */

      "13900": [

        {
          ja: "ウニ食べ比べ",
          en: "Sea Urchin Tasting",
          items: []
        },

        {
          ja: "強肴",
          en: "Seasonal Dishes",
          items: [
            "crab",
            "fig"
          ]
        },

        {
          ja: "茶碗蒸し",
          en: "Steamed Egg Custard",
          items: [
            "shirako"
          ]
        },

        {
          ja: "鮨",
          en: "Sushi",
          items: [
            "squid",
            "bonito",
            "shellfish",
            "shrimp",
            "shima"
          ]
        },

        {
          ja: "焼き物",
          en: "Grilled Dish",
          items: [
            "salmon"
          ]
        },

        {
          ja: "揚げ物",
          en: "Tempura",
          items: [
            "hamo"
          ]
        },

        {
          ja: "香の物",
          en: "Pickles",
          items: []
        },

        {
          ja: "鮨",
          en: "Sushi",
          items: [
            "akami",
            "chutoro",
            "whitefish",
            "kohada",
            "torotaku",
            "anago",
            "tamago"
          ]
        },

        {
          ja: "お椀",
          en: "Soup",
          items: []
        },

        {
          ja: "甘味",
          en: "Dessert",
          items: []
        }

      ],



      /* =====================
         16,900円
         ===================== */

      "16900": [

        {
          ja: "ウニ食べ比べ",
          en: "Sea Urchin Tasting",
          items: []
        },

        {
          ja: "強肴",
          en: "Seasonal Dishes",
          items: [
            "crab",
            "fig"
          ]
        },

        {
          ja: "茶碗蒸し",
          en: "Steamed Egg Custard",
          items: [
            "shirako"
          ]
        },

        {
          ja: "鮨",
          en: "Sushi",
          items: [
            "squid",
            "bonito",
            "shellfish",
            "shrimp",
            "shima"
          ]
        },

        {
          ja: "焼き物",
          en: "Grilled Dish",
          items: [
            "salmon"
          ]
        },

        {
          ja: "揚げ物",
          en: "Tempura",
          items: [
            "hamo"
          ]
        },

        {
          ja: "鮑の酒蒸し 肝ソース",
          en: "Sake-steamed Abalone with Liver Sauce",
          items: []
        },

        {
          ja: "香の物",
          en: "Pickles",
          items: []
        },

        {
          ja: "鮨",
          en: "Sushi",
          items: [
            "akami",
            "chutoro",
            "whitefish",
            "kohada",
            "torotaku",
            "anago",
            "tamago"
          ]
        },

        {
          ja: "お椀",
          en: "Soup",
          items: []
        },

        {
          ja: "甘味",
          en: "Dessert",
          items: []
        }

      ]

    };



    /* =========================
       日本語・英語切り替え
       ========================= */

    function setLanguage(language) {

      currentLanguage = language;

      document.documentElement.lang =
        language === "ja" ? "ja" : "en";


      // 選択中の言語を表示

      document
        .getElementById("jaButton")
        .classList.toggle(
          "active",
          language === "ja"
        );

      document
        .getElementById("enButton")
        .classList.toggle(
          "active",
          language === "en"
        );

      document
        .getElementById("jaButton")
        .setAttribute(
          "aria-pressed",
          language === "ja"
        );

      document
        .getElementById("enButton")
        .setAttribute(
          "aria-pressed",
          language === "en"
        );


      // 最初の画面の文字を変更

      document
        .getElementById("homeTitle")
        .textContent =
          language === "ja"
          ? "お品書き"
          : "Menu";


      // 価格選択ボタン

      document
        .querySelectorAll(".course-button")
        .forEach(function(button) {

          const price = Number(
            button.dataset.course
          ).toLocaleString("ja-JP");

          button.textContent =
            language === "ja"
            ? price + "円コース"
            : "¥" + price + " Course";

        });


      // 戻るボタン

      document
        .getElementById("backButton")
        .textContent =
          language === "ja"
          ? "← コース選択に戻る"
          : "← Back to Menu";


      // コースを表示中なら更新

      if (currentCourse !== null) {
        renderCourse(currentCourse);
      }

    }



    /* =========================
       コースを選択
       ========================= */

    function showCourse(courseId) {

      currentCourse = courseId;

      document
        .getElementById("home")
        .hidden = true;

      document
        .getElementById("coursePage")
        .hidden = false;

      renderCourse(courseId);

      window.scrollTo(0, 0);

    }



    /* =========================
       コース料理一覧を表示
       ========================= */

    function renderCourse(courseId) {

      const content = document.getElementById(
        "courseContent"
      );

      content.replaceChildren();


      // コースタイトル

      const title = document.createElement("h2");

      title.textContent =
        menuMonth[currentLanguage];

      content.appendChild(title);


      // 価格

      const price = document.createElement("div");

      price.className = "course-price";

      const formattedPrice = Number(
        courseId
      ).toLocaleString("ja-JP");

      price.textContent =
        currentLanguage === "ja"
        ? formattedPrice + "円"
        : "¥" + formattedPrice;

      content.appendChild(price);


      // 各カテゴリーと料理名

      courses[courseId].forEach(
        function(sectionData) {

          const section =
            document.createElement("section");

          section.className = "section";


          // カテゴリー名

          const category =
            document.createElement("h3");

          category.className = "category";

          category.textContent =
            sectionData[currentLanguage];

          section.appendChild(category);


          // 料理リスト

          if (sectionData.items.length > 0) {

            const list =
              document.createElement("ul");

            list.className = "dish-list";


            sectionData.items.forEach(
              function(dishKey) {

                const item =
                  document.createElement("li");

                item.textContent =
                  dishes[dishKey][currentLanguage];

                list.appendChild(item);

              }
            );


            section.appendChild(list);

          }


          content.appendChild(section);

        }
      );

    }



    /* =========================
       最初の画面に戻る
       ========================= */

    function goHome() {

      currentCourse = null;

      document
        .getElementById("coursePage")
        .hidden = true;

      document
        .getElementById("home")
        .hidden = false;

      window.scrollTo(0, 0);

    }


    /* =========================
       初期化
       ========================= */

    setLanguage("ja");

  </script>


</body>

</html>
