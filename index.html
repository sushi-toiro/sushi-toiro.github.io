<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>鮨 といろ｜お品書き</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --gold: #d4af37;
      --gold-dark: #8f7440;
      --text: #f8f2e8;
      --subtext: #cfc2a5;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        linear-gradient(
          to bottom,
          #050814,
          #090d19,
          #111827
        );

      color: var(--text);

      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;
    }

    button,
    a {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
    }

    /* ヘッダー */

    .header {
      position: sticky;
      top: 0;

      z-index: 1000;

      width: 100%;

      text-align: center;

      padding: 7px 14px 10px;

      background:
        rgba(3, 6, 15, 0.97);

      border-bottom:
        1px solid rgba(212, 175, 55, 0.4);

      backdrop-filter: blur(8px);
    }

    .logo {
      display: block;

      width: 55px;
      height: 55px;

      object-fit: contain;

      margin: 0 auto 3px;
    }

    .shop-name {
      color: var(--gold);

      font-size: 10px;

      letter-spacing: 3px;

      margin-bottom: 7px;
    }

    .gold-line {
      width: 100px;
      height: 1px;

      margin: 5px auto 9px;

      background:
        linear-gradient(
          to right,
          transparent,
          var(--gold),
          transparent
        );
    }

    /* 言語切り替え */

    .language {
      display: flex;

      justify-content: center;

      gap: 9px;
    }

    .language button {
      padding: 7px 18px;

      font-size: 13px;

      color: var(--text);

      background: transparent;

      border:
        1px solid var(--gold-dark);

      border-radius: 999px;
    }

    .language button.active {
      background: var(--gold);

      color: #050814;

      border-color: var(--gold);
    }

    /* メニュー画面 */

    .container {
      max-width: 580px;

      margin: 0 auto;

      padding: 22px 16px 42px;
    }

    .panel {
      background:
        rgba(255, 255, 255, 0.035);

      border:
        1px solid rgba(212, 175, 55, 0.25);

      border-radius: 16px;

      padding: 28px 19px 34px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.25);
    }

    h1,
    h2 {
      text-align: center;

      font-weight: normal;
    }

    h1 {
      font-size: 27px;

      letter-spacing: 5px;

      margin: 0 0 18px;
    }

    h2 {
      font-size: 24px;

      letter-spacing: 3px;

      margin: 0 0 12px;
    }

    .subtitle {
      text-align: center;

      color: var(--subtext);

      font-size: 14px;

      margin-bottom: 30px;
    }

    /* 選択ボタン */

    .select-button {
      display: block;

      width: 100%;

      margin: 16px 0;

      padding: 22px 15px;

      font-size: 20px;

      color: var(--text);

      background:
        rgba(255, 255, 255, 0.03);

      border:
        1px solid rgba(212, 175, 55, 0.5);

      border-radius: 10px;

      transition: 0.2s;
    }

    .select-button:hover {
      background:
        rgba(212, 175, 55, 0.1);
    }

    /* 料理 */

    .price {
      text-align: center;

      color: var(--gold);

      font-size: 21px;

      margin: 0 0 30px;
    }

    .category {
      text-align: center;

      font-size: 20px;

      font-weight: normal;

      color: var(--gold);

      letter-spacing: 3px;

      margin-top: 37px;
      margin-bottom: 17px;

      padding-bottom: 9px;

      border-bottom:
        1px solid rgba(212, 175, 55, 0.35);
    }

    .item {
      text-align: center;

      font-size: 17px;

      line-height: 1.9;

      margin: 13px 0;

      color: #f5eee2;
    }

    /* 戻る */

    .back-button {
      display: block;

      margin: 38px auto 0;

      padding: 11px 28px;

      font-size: 15px;

      color: var(--text);

      background: transparent;

      border:
        1px solid var(--gold-dark);

      border-radius: 999px;
    }

    .back-button:hover {
      background:
        rgba(212, 175, 55, 0.12);
    }

    /* Instagram */

    .instagram-footer {
      text-align: center;

      padding: 8px 16px 38px;
    }

    .instagram-link {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 60px;
      height: 60px;

      color: var(--gold);

      border:
        1px solid var(--gold-dark);

      border-radius: 50%;

      background:
        rgba(212, 175, 55, 0.05);

      text-decoration: none;
    }

    .instagram-link svg {
      width: 30px;
      height: 30px;
    }

    .copyright {
      text-align: center;

      margin: 20px 0 0;

      color: var(--gold-dark);

      font-size: 10px;

      letter-spacing: 3px;
    }

    @media (max-width: 480px) {
      .logo {
        width: 50px;
        height: 50px;
      }

      .container {
        padding:
          18px 14px 36px;
      }

      .panel {
        padding:
          24px 15px 28px;
      }

      h1 {
        font-size: 25px;
      }

      h2 {
        font-size: 22px;
      }

      .category {
        font-size: 19px;
      }

      .item {
        font-size: 16px;
      }

      .select-button {
        font-size: 19px;
      }
    }
  </style>
</head>


<body>

  <!-- ヘッダー -->

  <header class="header">

    <img
      src="logo.png"
      alt="鮨 といろ"
      class="logo"
    >

    <div class="shop-name">
      SUSHI TOIRO
    </div>

    <div class="gold-line"></div>

    <div class="language">

      <button
        id="jaButton"
        class="active"
        onclick="setLanguage('ja')"
      >
        日本語
      </button>

      <button
        id="enButton"
        onclick="setLanguage('en')"
      >
        English
      </button>

    </div>

  </header>


  <!-- メニュー -->

  <main class="container">

    <div class="panel">

      <!-- 席種 -->

      <div id="seatPage">

        <h1 id="homeTitle">
          11月のお品書き
        </h1>

        <div
          class="subtitle"
          id="seatSubtitle"
        >
          お席をお選びください
        </div>

        <button
          class="select-button"
          id="counterButton"
          onclick="showSeat('counter')"
        >
          カウンター
        </button>

        <button
          class="select-button"
          id="tableButton"
          onclick="showSeat('table')"
        >
          テーブル
        </button>

      </div>


      <!-- コース選択 -->

      <div
        id="pricePage"
        hidden
      >

        <h2 id="seatTitle"></h2>

        <div
          class="subtitle"
          id="courseSubtitle"
        ></div>

        <div id="courseButtons"></div>

        <button
          class="back-button"
          id="backToSeat"
          onclick="goSeatPage()"
        >
          ← 席種選択に戻る
        </button>

      </div>


      <!-- 料理一覧 -->

      <div
        id="menuPage"
        hidden
      >

        <h2 id="menuTitle"></h2>

        <div
          class="price"
          id="menuPrice"
        ></div>

        <div id="menuContent"></div>

        <button
          class="back-button"
          id="backToPrice"
          onclick="goPricePage()"
        >
          ← コース選択に戻る
        </button>

        <button
          class="back-button"
          id="backToSeatFromMenu"
          onclick="goSeatPage()"
        >
          ← 席種選択に戻る
        </button>

      </div>

    </div>

  </main>


  <!-- Instagram -->

  <footer class="instagram-footer">

    <a
      class="instagram-link"
      href="https://www.instagram.com/p/DZavhNGkjME/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram"
    >

      <svg
        xmlns="http://www.w3.org/2000/svg"

        <circle

      </svg>

    </a>

    <p class="copyright">
      SUSHI TOIRO
    </p>

  </footer>

          "tableIsland",

          "tableSurfClam",

          "chutoro",

    /* =========================
       共通
       ========================= */

    function t(key) {

      return texts[currentLanguage][key];

    }


    function formatPrice(price) {

      return Number(price)
        .toLocaleString("ja-JP");

    }


    function createElement(
      tag,
      className,
      value
    ) {

      const el =
        document.createElement(tag);


      if (className) {

        el.className =
          className;

      }


      if (
        value !== undefined
      ) {

        el.textContent =
          value;

      }


      return el;

    }


    /* =========================
       言語
       ========================= */

    function setLanguage(lang) {

      currentLanguage =
        lang;

      document.documentElement.lang =
        lang;

      render();

    }


    /* =========================
       席選択
       ========================= */

    function showSeat(seat) {

      currentSeat =
        seat;

      currentCourse =
        null;

      render();

      window.scrollTo(
        0,
        0
      );

    }


    /* =========================
       コース選択
       ========================= */

    function showCourse(course) {

      currentCourse =
        course;

      render();

      window.scrollTo(
        0,
        0
      );

    }


    /* =========================
       席選択へ戻る
       ========================= */

    function goSeatPage() {

      currentSeat =
        null;

      currentCourse =
        null;

      render();

      window.scrollTo(
        0,
        0
      );

    }


    /* =========================
       コース選択へ戻る
       ========================= */

    function goPricePage() {

      currentCourse =
        null;

      render();

      window.scrollTo(
        0,
        0
      );

    }


    /* =========================
       料理表示
       ========================= */

    function renderMenu() {

      const container =
        document
          .getElementById(
            "menuContent"
          );


      container.replaceChildren();


      const list =
        courses
          [currentSeat]
          [currentCourse];


      let previousType =
        null;


      list.forEach(
        function(key) {


          const dish =
            dishes[key];


          const type =
            dish.type;


          /* 種類が変わったら見出し */

          if (
            type !== previousType
          ) {

            container.appendChild(

              createElement(
                "h3",
                "category",
                t(type)
              )

            );


            previousType =
              type;

          }


          /* お椀・甘味は見出しのみ */

          if (
            type === "soup" ||
            type === "dessert"
          ) {

            return;

          }


          container.appendChild(

            createElement(
              "div",
              "item",
              dish[currentLanguage]
            )

          );


        }
      );

    }


    /* =========================
       画面更新
       ========================= */

    function render() {


      /* 言語ボタン */


      document
        .getElementById(
          "jaButton"
        )
        .classList
        .toggle(
          "active",
          currentLanguage === "ja"
        );


      document
        .getElementById(
          "enButton"
        )
        .classList
        .toggle(
          "active",
          currentLanguage === "en"
        );


      /* ページ表示 */


      document
        .getElementById(
          "seatPage"
        )
        .hidden =
          currentSeat !== null;


      document
        .getElementById(
          "pricePage"
        )
        .hidden =
          currentSeat === null ||
          currentCourse !== null;


      document
        .getElementById(
          "menuPage"
        )
        .hidden =
          currentCourse === null;


      /* 席選択 */


      document
        .getElementById(
          "homeTitle"
        )
        .textContent =
          t("month");


      document
        .getElementById(
          "seatSubtitle"
        )
        .textContent =
          t("seatSelect");


      document
        .getElementById(
          "counterButton"
        )
        .textContent =
          t("counter");


      document
        .getElementById(
          "tableButton"
        )
        .textContent =
          t("table");


      if (
        currentSeat === null
      ) {

        return;

      }


      /* コース選択 */


      document
        .getElementById(
          "seatTitle"
        )
        .textContent =
          t(currentSeat);


      document
        .getElementById(
          "courseSubtitle"
        )
        .textContent =
          t("courseSelect");


      document
        .getElementById(
          "backToSeat"
        )
        .textContent =
          t("backSeat");


      const buttons =
        document
          .getElementById(
            "courseButtons"
          );


      buttons.replaceChildren();


      Object
        .keys(
          courses[currentSeat]
        )
        .sort(
          (a, b) =>
            Number(b) -
            Number(a)
        )
        .forEach(
          function(price) {


            const btn =
              createElement(
                "button",
                "select-button"
              );


            btn.textContent =

              currentLanguage === "ja"

              ? formatPrice(price) +
                "円コース"

              : "¥" +
                formatPrice(price) +
                " Course";


            btn.onclick =
              function() {

                showCourse(
                  price
                );

              };


            buttons
              .appendChild(
                btn
              );

          }
        );


      if (
        currentCourse === null
      ) {

        return;

      }


      /* メニュー画面 */


      document
        .getElementById(
          "menuTitle"
        )
        .textContent =

          t("month") +
          "・" +
          t(currentSeat);


      document
        .getElementById(
          "menuPrice"
        )
        .textContent =

          currentLanguage === "ja"

          ? formatPrice(
              currentCourse
            ) + "円"

          : "¥" +
            formatPrice(
              currentCourse
            );


      document
        .getElementById(
          "backToPrice"
        )
        .textContent =
          t("backCourse");


      document
        .getElementById(
          "backToSeatFromMenu"
        )
        .textContent =
          t("backSeat");


      renderMenu();

    }


    /* 初期表示 */

    render();

  </script>

</body>

</html>
