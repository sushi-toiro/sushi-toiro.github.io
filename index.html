
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>鮨 といろ｜10月のお品書き</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #050817;
      --panel: #0b1020;
      --gold: #cdb075;
      --line: rgba(205,176,117,.38);
      --text: #f8f2e8;
      --muted: #c7bcaa;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        linear-gradient(
          180deg,
          #050817,
          #12182a
        );

      color: var(--text);

      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        "Noto Serif JP",
        serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }


    /* =========================
       ロゴ・ヘッダー
       ========================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 10;

      background: rgba(5,8,23,.97);

      border-bottom:
        1px solid var(--line);

      backdrop-filter: blur(8px);

      padding: 6px 12px 10px;
      text-align: center;
    }

    .logo {
      display: block;

      width: 54px;
      height: 54px;

      object-fit: contain;

      margin: 0 auto 2px;
    }

    .brand {
      color: var(--gold);
      letter-spacing: .24em;

      font-size: 10px;
      margin: 0 0 7px;
    }


    /* =========================
       言語切り替え
       ========================= */

    .langs {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .langs button {
      padding: 6px 18px;

      border-radius: 999px;
      border: 1px solid var(--gold);

      color: var(--text);
      background: transparent;

      font-size: 13px;
    }

    .langs button.active {
      background: var(--gold);
      color: #050817;
    }


    /* =========================
       ページ全体
       ========================= */

    main {
      max-width: 570px;

      padding: 20px 16px 40px;
      margin: auto;
    }

    .panel {
      background: rgba(255,255,255,.035);

      border: 1px solid var(--line);
      border-radius: 15px;

      padding: 27px 19px 34px;
    }

    h1, h2 {
      margin: 0;
      text-align: center;
      font-weight: normal;
    }

    h1 {
      font-size: 26px;
      letter-spacing: .16em;
      margin-bottom: 9px;
    }

    h2 {
      font-size: 22px;
      letter-spacing: .08em;
    }

    .subtitle {
      margin: 0 0 26px;

      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }


    /* =========================
       席・コース選択
       ========================= */

    .choices {
      display: grid;
      gap: 15px;
      margin-top: 24px;
    }

    .choice {
      width: 100%;

      background: rgba(255,255,255,.035);

      border: 1px solid var(--line);
      border-radius: 10px;

      padding: 21px 13px;

      color: var(--text);
      font-size: 20px;
    }

    .choice:active,
    .choice:hover {
      background: rgba(205,176,117,.13);
    }


    /* =========================
       料理一覧
       ========================= */

    .price {
      color: var(--gold);
      font-size: 23px;

      text-align: center;
      margin: 10px 0 28px;
    }

    .menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .menu li {
      text-align: center;

      padding: 12px 3px;

      font-size: 17px;
      line-height: 1.65;

      border-bottom:
        1px solid rgba(205,176,117,.16);
    }


    /* =========================
       特別な案内
       ========================= */

    .note {
      margin: 10px auto 0;
      padding: 12px;

      font-size: 13px;
      color: var(--muted);

      line-height: 1.8;
      text-align: center;

      border:
        1px solid rgba(205,176,117,.28);

      border-radius: 8px;
    }


    /* =========================
       といろ巻きの中身
       ========================= */

    .roll {
      margin-top: 32px;

      padding: 16px 14px 20px;

      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .roll h3 {
      text-align: center;

      color: var(--gold);

      font-size: 18px;
      font-weight: normal;

      margin: 0 0 18px;
    }

    .roll h4 {
      text-align: center;

      color: var(--gold);

      font-size: 15px;
      font-weight: normal;

      margin: 17px 0 9px;
    }

    .roll p {
      text-align: center;

      font-size: 15px;
      line-height: 1.9;

      margin: 0;
      white-space: pre-line;
    }


    /* =========================
       戻るボタン
       ========================= */

    .back {
      display: block;

      background: transparent;
      color: var(--text);

      border: 1px solid var(--gold);
      border-radius: 999px;

      margin: 32px auto 0;
      padding: 11px 23px;

      font-size: 14px;
    }


    /* =========================
       フッター
       ========================= */

    .footer {
      text-align: center;

      color: var(--gold);
      letter-spacing: .25em;

      font-size: 10px;
      margin: 32px 0 0;
    }


    /* =========================
       スマホ対応
       ========================= */

    @media(max-width: 480px) {

      .panel {
        padding: 24px 15px 29px;
      }

      .menu li {
        font-size: 16px;
      }

      .choice {
        font-size: 19px;
      }

      h1 {
        font-size: 24px;
      }

    }

  </style>
</head>


<body>

  <!-- =========================
       ロゴと日本語・英語切替
       ========================= -->

  <header class="header">

    <img
      src="logo.png"
      alt="鮨 といろのロゴ"
      class="logo"
    >

    <p class="brand">
      SUSHI TOIRO
    </p>

    <div class="langs">

      <button
        id="jaBtn"
        type="button"
        onclick="setLanguage('ja')"
      >
        日本語
      </button>

      <button
        id="enBtn"
        type="button"
        onclick="setLanguage('en')"
      >
        English
      </button>

    </div>

  </header>


  <main>

    <div class="panel">


      <!-- =====================
           1. 席種選択画面
           ===================== -->

      <section id="seatScreen">

        <h1 id="seatTitle"></h1>

        <p
          class="subtitle"
          id="seatSub"
        ></p>

        <div class="choices">

          <button
            class="choice"
            type="button"
            id="counterBtn"
            onclick="chooseSeat('counter')"
          ></button>

          <button
            class="choice"
            type="button"
            id="tableBtn"
            onclick="chooseSeat('table')"
          ></button>

        </div>

      </section>



      <!-- =====================
           2. コース選択画面
           ===================== -->

      <section
        id="courseScreen"
        hidden
      >

        <h2 id="courseSelectTitle"></h2>

        <p
          class="subtitle"
          id="courseSelectSub"
        ></p>

        <div
          class="choices"
          id="courseButtons"
        ></div>

        <button
          class="back"
          id="backToSeat"
          type="button"
          onclick="chooseSeat(null)"
        ></button>

      </section>



      <!-- =====================
           3. 料理一覧画面
           ===================== -->

      <section
        id="detailScreen"
        hidden
      >

        <h2 id="detailTitle"></h2>

        <p
          class="price"
          id="detailPrice"
        ></p>

        <ul
          class="menu"
          id="dishList"
        ></ul>


        <!-- といろ巻き -->

        <div
          class="roll"
          id="rollBox"
          hidden
        >

          <h3 id="rollTitle"></h3>

          <h4 id="rollTopTitle"></h4>

          <p id="rollTop"></p>

          <h4 id="rollInsideTitle"></h4>

          <p id="rollInside"></p>

        </div>


        <button
          class="back"
          id="backToCourse"
          type="button"
          onclick="chooseCourse(null)"
        ></button>

        <button
          class="back"
          id="backToSeatFromDetail"
          type="button"
          onclick="chooseSeat(null)"
        ></button>

      </section>

    </div>


    <p class="footer">
      SUSHI TOIRO
    </p>

  </main>



  <script>

    /* =========================
       現在の状態
       ========================= */

    let language = 'ja';

    let seat = null;

    let selectedCourse = null;



    /* =========================
       画面の日本語・英語
       ========================= */

    const words = {

      ja: {

        menu: '10月のお品書き',

        chooseSeat: 'お席をお選びください',

        counter: 'カウンター',

        table: 'テーブル',

        selectCourse: 'コースをお選びください',

        course: 'コース',

        backSeat: '← 席種選択に戻る',

        backCourses: '← コース選択に戻る',

        roll: 'といろ巻きの中身',

        top: '上',

        inside: '中',

        uniNote:
          '※ウニ食べ比べを追加されたお客様は、バフンウニまたはムラサキウニをお選びいただけます。'

      },

      en: {

        menu: 'October Menu',

        chooseSeat: 'Please select your seating',

        counter: 'Counter Seating',

        table: 'Table Seating',

        selectCourse: 'Please select a course',

        course: 'Course',

        backSeat: '← Back to Seating',

        backCourses: '← Back to Courses',

        roll: 'Toiro Roll Ingredients',

        top: 'On Top',

        inside: 'Inside',

        uniNote:
          'Guests who add the sea urchin tasting may choose Bafun or Murasaki sea urchin.'

      }

    };



    /* =========================
       全料理名
       日本語 / English
       ========================= */

    const dishNames = {

      uniTasting: [
        'ウニ食べ比べ',
        'Sea Urchin Tasting'
      ],

      eelCustard: [
        '鰻とカボチャ餡の茶碗蒸し',
        'Steamed Egg Custard with Eel and Pumpkin Sauce'
      ],

      squid: [
        'イカ　墨塩',
        'Squid (Squid Ink Salt)'
      ],

      kohada: [
        'コハダ　おぼろ',
        'Gizzard Shad (Oboro)'
      ],

      shrimp: [
        '生エビ　エビパウダー',
        'Fresh Shrimp (Shrimp Powder)'
      ],

      island: [
        '島寿司　辛子',
        'Island-style Sushi (Japanese Mustard)'
      ],

      arkClam: [
        '赤貝',
        'Ark Shell'
      ],

      fried: [
        '揚げ物',
        'Fried Dish'
      ],

      abalone: [
        '鮑酒蒸し　肝ソース',
        'Sake-steamed Abalone with Liver Sauce'
      ],

      kinmedai: [
        '金目鯛の一口蒸し',
        'Bite-sized Steamed Splendid Alfonsino'
      ],

      akami: [
        '赤身',
        'Lean Tuna'
      ],

      chutoro: [
        '中トロ',
        'Medium-fatty Tuna'
      ],

      torotaku: [
        'トロタクおはぎ',
        'Toro-Taku Ohagi'
      ],

      nodoguro: [
        'ノドグロ炙り　塩スダチ',
        'Seared Blackthroat Seaperch (Salt and Sudachi)'
      ],

      anago: [
        '穴子',
        'Conger Eel'
      ],

      tamago: [
        '玉子',
        'Japanese Omelet'
      ],

      soup: [
        'お椀',
        'Soup'
      ],

      dessert: [
        '甘味',
        'Dessert'
      ],

      seasonal: [
        '強肴',
        'Seasonal Special Dish'
      ],

      surfClam: [
        '北寄貝炙り　塩スダチ',
        'Seared Surf Clam (Salt and Sudachi)'
      ],

      whitefish: [
        '白身昆布〆',
        'Kelp-cured White Fish'
      ],

      uni: [
        'ウニ',
        'Sea Urchin'
      ],

      scallop: [
        'ホタテ',
        'Scallop'
      ],

      toiroRoll: [
        'といろ巻き（中巻き1貫）',
        'Toiro Roll (1 piece of medium sushi roll)'
      ]

    };



    /* =========================
       10月のコース構成
       ========================= */

    const menus = {


      /* =====================
         カウンターコース
         ===================== */

      counter: {


        /* 16,900円 */

        '16900': [

          'uniTasting',

          'eelCustard',

          'squid',

          'kohada',

          'shrimp',

          'island',

          'arkClam',

          'fried',

          'abalone',

          'kinmedai',

          'akami',

          'chutoro',

          'torotaku',

          'nodoguro',

          'anago',

          'tamago',

          'soup',

          'dessert'

        ],



        /* 13,900円 */

        '13900': [

          'seasonal',

          'eelCustard',

          'squid',

          'kohada',

          'shrimp',

          'island',

          'surfClam',

          'fried',

          'kinmedai',

          'akami',

          'chutoro',

          'torotaku',

          'whitefish',

          'anago',

          'uni',

          'tamago',

          'soup',

          'dessert'

        ]

      },



      /* =====================
         テーブルコース
         ===================== */

      table: {


        /* 10,800円 */

        '10800': [

          'seasonal',

          'squid',

          'kohada',

          'shrimp',

          'island',

          'surfClam',

          'whitefish',

          'eelCustard',

          'akami',

          'chutoro',

          'torotaku',

          'scallop',

          'anago',

          'toiroRoll',

          'tamago',

          'soup'

        ],



        /* 8,800円 */

        '8800': [

          'squid',

          'kohada',

          'shrimp',

          'island',

          'surfClam',

          'whitefish',

          'akami',

          'chutoro',

          'torotaku',

          'scallop',

          'anago',

          'toiroRoll',

          'tamago',

          'soup'

        ]

      }

    };



    /* =========================
       といろ巻きの中身
       ========================= */

    const rollIngredients = {

      top: [

        ['ウニ', 'Sea Urchin'],

        ['イクラ', 'Salmon Roe'],

        ['中落ち', 'Tuna Nakaochi']

      ],

      inside: [

        ['白身昆布締め', 'Kelp-cured White Fish'],

        ['光物', 'Silver-skinned Fish'],

        ['ゴボウ醤油漬け', 'Soy-marinated Burdock Root'],

        ['おぼろ', 'Oboro'],

        ['沢庵', 'Pickled Daikon'],

        ['カッパ', 'Cucumber'],

        ['とびっ子', 'Flying Fish Roe']

      ]

    };



    /* =========================
       文字・価格の処理
       ========================= */

    function word(key) {

      return words[language][key];

    }


    function money(number) {

      return '¥' +
        Number(number).toLocaleString('ja-JP');

    }


    function nameOf(id) {

      return dishNames[id][
        language === 'ja' ? 0 : 1
      ];

    }



    /* =========================
       言語を変更
       ========================= */

    function setLanguage(next) {

      language = next;

      render();

    }



    /* =========================
       席種を選択
       ========================= */

    function chooseSeat(next) {

      seat = next;

      selectedCourse = null;

      render();

      window.scrollTo(0, 0);

    }



    /* =========================
       コースを選択
       ========================= */

    function chooseCourse(next) {

      selectedCourse = next;

      render();

      window.scrollTo(0, 0);

    }



    /* =========================
       ページの表示処理
       ========================= */

    function render() {


      /* 言語切り替えボタン */

      document.documentElement.lang = language;

      document
        .getElementById('jaBtn')
        .classList.toggle(
          'active',
          language === 'ja'
        );

      document
        .getElementById('enBtn')
        .classList.toggle(
          'active',
          language === 'en'
        );

      document
        .getElementById('jaBtn')
        .setAttribute(
          'aria-pressed',
          String(language === 'ja')
        );

      document
        .getElementById('enBtn')
        .setAttribute(
          'aria-pressed',
          String(language === 'en')
        );



      /* 各画面を取得 */

      const seatScreen =
        document.getElementById('seatScreen');

      const courseScreen =
        document.getElementById('courseScreen');

      const detailScreen =
        document.getElementById('detailScreen');



      /* 表示する画面を決める */

      seatScreen.hidden =
        seat !== null;

      courseScreen.hidden =
        seat === null ||
        selectedCourse !== null;

      detailScreen.hidden =
        selectedCourse === null;



      /* 最初の席種選択画面 */

      document
        .getElementById('seatTitle')
        .textContent =
          word('menu');

      document
        .getElementById('seatSub')
        .textContent =
          word('chooseSeat');

      document
        .getElementById('counterBtn')
        .textContent =
          word('counter');

      document
        .getElementById('tableBtn')
        .textContent =
          word('table');


      if (seat === null) {
        return;
      }



      /* コース選択画面 */

      document
        .getElementById('courseSelectTitle')
        .textContent =
          word(seat);

      document
        .getElementById('courseSelectSub')
        .textContent =
          word('selectCourse');

      document
        .getElementById('backToSeat')
        .textContent =
          word('backSeat');



      if (selectedCourse === null) {

        const buttons =
          document.getElementById('courseButtons');

        buttons.replaceChildren();



        Object.keys(menus[seat])

          .sort(
            (a, b) => Number(b) - Number(a)
          )

          .forEach(function(id) {

            const button =
              document.createElement('button');

            button.type = 'button';

            button.className = 'choice';


            button.textContent =
              language === 'ja'

              ? Number(id).toLocaleString('ja-JP')
                + '円コース'

              : money(id) + ' Course';


            button.addEventListener(
              'click',
              function() {

                chooseCourse(id);

              }
            );


            buttons.appendChild(button);

          });


        return;

      }



      /* =====================
         コースの料理一覧
         ===================== */

      document
        .getElementById('detailTitle')
        .textContent =
          word('menu') + ' · ' + word(seat);


      document
        .getElementById('detailPrice')
        .textContent =
          money(selectedCourse);



      /* 戻るボタン */

      document
        .getElementById('backToCourse')
        .textContent =
          word('backCourses');

      document
        .getElementById('backToSeatFromDetail')
        .textContent =
          word('backSeat');



      /* 料理一覧を生成 */

      const dishList =
        document.getElementById('dishList');

      dishList.replaceChildren();



      menus[seat][selectedCourse]
        .forEach(function(key) {


          const li =
            document.createElement('li');


          li.textContent =
            nameOf(key);


          dishList.appendChild(li);



          /* 13,900円のウニの案内 */

          if (
            seat === 'counter' &&
            selectedCourse === '13900' &&
            key === 'uni'
          ) {

            const note =
              document.createElement('li');

            note.className = 'note';

            note.textContent =
              word('uniNote');

            dishList.appendChild(note);

          }

        });



      /* =====================
         といろ巻きの中身
         ===================== */

      const roll =
        document.getElementById('rollBox');


      roll.hidden =
        seat !== 'table';



      if (seat === 'table') {


        document
          .getElementById('rollTitle')
          .textContent =
            word('roll');


        document
          .getElementById('rollTopTitle')
          .textContent =
            word('top');


        document
          .getElementById('rollInsideTitle')
          .textContent =
            word('inside');



        const index =
          language === 'ja' ? 0 : 1;



        document
          .getElementById('rollTop')
          .textContent =

            rollIngredients.top
              .map(
                item => item[index]
              )
              .join('・');



        document
          .getElementById('rollInside')
          .textContent =

            rollIngredients.inside
              .map(
                item => item[index]
              )
              .join('・');

      }

    }



    /* =========================
       最初の画面を表示
       ========================= */

    render();

  </script>

</body>
</html>
